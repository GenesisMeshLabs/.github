name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, private keys, tokens, or private deployment details.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable reproduction.
      placeholder: |
        1. Run ...
        2. Call ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.x.y or commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, runtime, language version, package version, deployment mode
  - type: textarea
    id: security-impact
    attributes:
      label: Trust or security impact
      description: Does this affect identity, recognition, revocation, evidence, authorization, policy, or auditability?
      placeholder: None, or describe the impact.
