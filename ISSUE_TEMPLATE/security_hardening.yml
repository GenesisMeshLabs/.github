name: Security hardening
description: Suggest a security improvement that is not an active vulnerability report
title: "[Security hardening]: "
labels: ["security", "hardening", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form for active vulnerabilities or exploit details. Follow SECURITY.md for private reporting.
  - type: textarea
    id: area
    attributes:
      label: Area
      description: What component, behavior, or workflow should be hardened?
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk model
      description: What risk does this reduce?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed hardening
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
